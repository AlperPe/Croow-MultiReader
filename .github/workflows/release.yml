name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f uygulama/requirements.txt ]; then pip install -r uygulama/requirements.txt; fi

      - name: Build with PyInstaller
        shell: bash
        run: pyinstaller paketleme/croow_reader.spec

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist
          tar -cJf ../CroowMultiReader-${{ matrix.name }}.tar.xz *

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath CroowMultiReader-${{ matrix.name }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CroowMultiReader-*.tar.xz
            CroowMultiReader-*.zip
